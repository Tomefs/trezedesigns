    <script defer src="contact.js"></script>
    <script defer src="projects.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="home">
      <header>
        <div class="navBar">
          <a href="index.html">
            <object data="icons/logo_13.svg" type="image/svg+xml" aria-label="Tomé Simões home">
              <img src="icons/logo-balck.png" alt="Tomé Simões home" loading="eager" decoding="async" />
            </object>
          </a>
          <button class="mobile-menu-toggle" type="button" aria-label="Open menu" aria-controls="site-navigation" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
          <nav class="icon" id="site-navigation" aria-label="Main navigation">
            <a href="index.html"><p>Projects</p></a>
            <a href="motion.html"><p>Motion</p></a>
            <a href="about.html"><p>About</p></a>
          </nav>
          <div class="nav-utilities">
            <a class="language-switch" href="pt/project.html" lang="pt-PT" hreflang="pt-PT"><p>PT</p></a>
            <button class="contact-trigger" type="button" aria-haspopup="dialog" aria-controls="contact-dialog">
              Contact
            </button>
          </div>
        </div>
      </header>
      <main data-project-detail>
        <section class="descricao" data-project-description>
          <noscript>Enable JavaScript to view this project. <a href="index.html">Return to all projects.</a></noscript>
        </section>
        <section class="Animations" data-project-media></section>
      </main>
      <footer>
        <div class="bar">
          <p>©Tomé Simões 2025</p>
          <div class="icon">
            <a href="https://www.linkedin.com/in/tom%C3%A9-sim%C3%B5es-532624321/"><p>LinkedIn</p></a>
            <a href="https://www.instagram.com/treze_designs/"><p>Instagram</p></a>
          </div>
        </div>
      </footer>
    </div>
    <dialog class="contact-dialog" id="contact-dialog" aria-labelledby="contact-title">
      <div class="contact-dialog__content">
        <button class="contact-dialog__close" type="button" aria-label="Close contact form">&times;</button>
        <h2 id="contact-title">Let’s work together</h2>
        <p>Have a project in mind? Send me a message and I’ll get back to you.</p>
        <form class="contact-form" action="https://formspree.io/f/xoeelygp" method="POST">
          <input type="hidden" name="_subject" value="New project enquiry from trezedesigns.com" />
          <input class="contact-form__honeypot" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" hidden />
          <div class="contact-form__field">
            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="contact-form__field">
            <label for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="contact-form__field">
            <label for="contact-message">Tell me about your project</label>
            <textarea id="contact-message" name="message" rows="5" required></textarea>
          </div>
          <button class="contact-form__submit" type="submit">Send message</button>
        </form>
      </div>
    </dialog>
  </body>
</html>
